<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#f59e0b" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- NỀN CHÍNH BO GÓC CHUẨN APP ICON -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#334155" stroke-width="3" opacity="0.4"/>

  <!-- BIỂU TƯỢNG KHIÊN BẢO MẬT & QUẢN TRỊ VIÊN -->
  <path d="M256 68 L376 116 C376 248 326 318 256 360 C186 318 136 248 136 116 Z" 
        fill="url(#shieldGrad)" stroke="#60a5fa" stroke-width="10" opacity="0.95"/>
  <path d="M256 86 L356 128 C356 236 314 298 256 336 C198 298 156 236 156 128 Z" 
        fill="#0f172a" opacity="0.35"/>

  <!-- CHỮ VIẾT TẮT VS NỔI BẬT TRÊN KHIÊN -->
  <text x="256" y="248" font-family="'Inter', -apple-system, Arial, sans-serif" font-size="118" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">VS</text>

  <!-- NGÔI SAO HOẶC BIỂU TƯỢNG DUYỆT -->
  <path d="M256 122 L262 140 L280 140 L266 152 L271 170 L256 158 L241 170 L246 152 L232 140 L250 140 Z" fill="#fbbf24"/>

  <!-- HUY HIỆU VÀNG ADMIN NỔI BẬT DƯỚI CÙNG ĐỂ NHẬN DIỆN TỨC THÌ -->
  <g filter="url(#glow)">
    <rect x="96" y="380" width="320" height="74" rx="22" fill="url(#goldGrad)" stroke="#fef3c7" stroke-width="3"/>
    <text x="256" y="432" font-family="'Inter', -apple-system, Arial, sans-serif" font-size="44" font-weight="900" fill="#0f172a" text-anchor="middle" letter-spacing="5">ADMIN</text>
  </g>
</svg>
