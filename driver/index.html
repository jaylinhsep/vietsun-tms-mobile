<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1e40af" />
  <title>Tài Xế - Vietsun TMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1e40af;
      --success: #16a34a;
      --warning: #d97706;
      --danger: #dc2626;
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --radius: 14px;
      --safe-bottom: env(safe-area-inset-bottom, 12px);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.45;
      padding-bottom: calc(74px + var(--safe-bottom));
    }

    /* HEADER */
    .driver-header {
      position: sticky; top: 0; z-index: 60;
      background: linear-gradient(135deg, #0f172a 0%, #1e40af 100%);
      color: #fff;
      padding: 10px 14px;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.2);
      display: flex; align-items: center; justify-content: space-between;
    }
    .header-user { display: flex; align-items: center; gap: 10px; }
    .driver-avatar {
      width: 38px; height: 38px; border-radius: 50%;
      background: #fff; color: var(--primary);
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 14px; box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }
    .driver-name { font-weight: 800; font-size: 14px; }
    .driver-plate {
      display: inline-block; background: #fbbf24; color: #000;
      font-weight: 800; font-size: 11.5px; padding: 2px 7px;
      border-radius: 6px; margin-top: 2px; letter-spacing: 0.4px;
    }

    /* DATE BAR */
    .date-bar {
      background: #fff;
      padding: 9px 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 7px;
      max-width: 680px;
      margin: 0 auto;
    }
    .date-chips {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .date-chips::-webkit-scrollbar { display: none; }
    .date-chip {
      padding: 6px 11px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 12px;
      border: 1px solid var(--border);
      background: #f8fafc;
      color: #334155;
      white-space: nowrap;
      cursor: pointer;
    }
    .date-chip.active {
      background: #1e40af;
      color: #fff;
      border-color: #1e40af;
    }
    .date-picker-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .date-input {
      flex: 1;
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-weight: 700;
      font-size: 13px;
      color: #0f172a;
      background: #f8fafc;
    }

    /* CONTENT */
    .container { padding: 12px; max-width: 680px; margin: 0 auto; }
    .trip-card {
      background: var(--card); border-radius: var(--radius);
      border: 1px solid var(--border); padding: 13px;
      margin-bottom: 12px; box-shadow: 0 2px 8px rgba(15, 23, 42, 0.05);
    }
    .trip-card.xuat-card { border-left: 5px solid #f97316; background: #fffaf5; }
    .trip-card.nhap-card { border-left: 5px solid #2563eb; background: #ffffff; }

    .badge {
      display: inline-block; padding: 3px 8px; border-radius: 6px;
      font-weight: 800; font-size: 11px;
    }
    .badge-xuat { background: #ffedd5; color: #c2410c; }
    .badge-nhap { background: #dbeafe; color: #1d4ed8; }
    .badge-20 { background: #e0f2fe; color: #0369a1; }
    .badge-40 { background: #fef3c7; color: #b45309; }

    .info-row { display: flex; align-items: flex-start; gap: 8px; margin: 6px 0; font-size: 13px; }
    .info-icon { font-size: 14px; flex-shrink: 0; margin-top: 1px; }

    /* ACTION BUTTONS */
    .btn-row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    .btn {
      flex: 1; padding: 9px 10px; border-radius: 9px; font-weight: 700;
      font-size: 12.5px; text-align: center; border: none; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center; gap: 5px;
      text-decoration: none;
    }
    .btn-call { background: #dcfce7; color: #15803d; border: 1px solid #bbf7d0; }
    .btn-update { background: var(--primary); color: #fff; }
    .btn-expense { background: #fef3c7; color: #b45309; border: 1px solid #fde68a; }

    /* FLOATING 20' / 40' QUICK FILTER DOCK (BOTTOM RIGHT - GIỐNG VS.HUUHOA.NET) */
    .floating-size-dock {
      position: fixed;
      right: 12px;
      bottom: calc(68px + var(--safe-bottom));
      z-index: 95;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .fab-size-btn {
      width: 46px;
      height: 46px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(6px);
      border: 1.5px solid #cbd5e1;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.16);
      color: #1e293b;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2px;
      transition: all 0.16s ease;
    }
    .fab-size-lbl { font-size: 13px; font-weight: 800; line-height: 1.1; }
    .fab-size-cnt {
      font-size: 10px; font-weight: 700; color: #64748b;
      background: #f1f5f9; padding: 0 5px; border-radius: 6px; margin-top: 2px;
    }
    .fab-size-btn.active-20 {
      background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%);
      border-color: #1d4ed8; color: #fff;
      box-shadow: 0 6px 18px rgba(37, 99, 235, 0.42); transform: scale(1.06);
    }
    .fab-size-btn.active-40 {
      background: linear-gradient(135deg, #d97706 0%, #ea580c 100%);
      border-color: #c2410c; color: #fff;
      box-shadow: 0 6px 18px rgba(234, 88, 12, 0.42); transform: scale(1.06);
    }
    .fab-size-btn.active-20 .fab-size-cnt,
    .fab-size-btn.active-40 .fab-size-cnt {
      background: rgba(255, 255, 255, 0.24); color: #fff;
    }

    /* BOTTOM NAVIGATION BAR (GIỐNG VS.HUUHOA.NET, ƯU TIÊN NHẬP TRƯỚC) */
    .bottom-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(10px);
      border-top: 1px solid var(--border);
      display: flex;
      padding: 6px 8px calc(6px + var(--safe-bottom));
      z-index: 90;
      box-shadow: 0 -2px 12px rgba(15, 23, 42, 0.06);
    }
    .nav-item {
      flex: 1;
      border: none;
      background: transparent;
      padding: 6px 4px;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s;
    }
    .nav-item .nav-icon { font-size: 17px; }
    .nav-item.active-nhap { background: #eff6ff; color: #1d4ed8; font-weight: 800; }
    .nav-item.active-xuat { background: #fff7ed; color: #c2410c; font-weight: 800; }
    .nav-item.active-all  { background: #f1f5f9; color: #0f172a; font-weight: 800; }

    /* MODAL */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.6);
      display: none; align-items: flex-end; justify-content: center;
      z-index: 150;
    }
    .modal-overlay.open { display: flex; }
    .modal-sheet {
      background: #fff; width: 100%; max-width: 500px;
      border-radius: 20px 20px 0 0; padding: 18px 18px calc(20px + var(--safe-bottom));
      max-height: 85vh; overflow-y: auto; box-shadow: 0 -4px 20px rgba(0,0,0,0.2);
    }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 5px; color: #334155; }
    .form-control {
      width: 100%; padding: 11px 12px; border-radius: 10px;
      border: 1px solid var(--border); font-size: 14.5px; font-weight: 600;
    }
    .form-control:focus { outline: none; border-color: var(--primary); }

    /* LOGIN OVERLAY */
    .login-overlay {
      position: fixed; inset: 0; background: #f8fafc; z-index: 200;
      display: flex; flex-direction: column; justify-content: center;
      padding: 24px; max-width: 420px; margin: 0 auto;
    }
  </style>
</head>
<body>

  <!-- LOGIN FORM -->
  <div class="login-overlay" id="driverLoginView">
    <div style="text-align:center;margin-bottom:24px;">
      <div style="font-size:46px;margin-bottom:8px;">🚛</div>
      <h2 style="margin:0;font-size:22px;font-weight:800;color:#1e3a8a;">VIETSUN TMS - TÀI XẾ</h2>
      <p style="margin:4px 0 0;color:var(--text-muted);font-size:13.5px;">Nhập Biển số xe & Mật khẩu để nhận chuyến</p>
    </div>
    <form id="driverLoginForm" onsubmit="handleDriverLogin(event)">
      <div class="form-group">
        <label>Số xe / Biển số xe (User)</label>
        <input type="text" id="loginPlate" class="form-control" placeholder="VD: 50E44057 hoặc 50H10106" required style="text-transform:uppercase;" autocomplete="username" />
      </div>
      <div class="form-group" style="margin-top:14px;">
        <label>Mật khẩu</label>
        <input type="password" id="loginPin" class="form-control" placeholder="Nhập mật khẩu" required autocomplete="current-password" />
      </div>
      <div id="loginError" style="color:var(--danger);font-size:13px;font-weight:600;margin:8px 0;display:none;"></div>
      <button type="submit" class="btn btn-update" style="width:100%;padding:14px;font-size:16px;margin-top:14px;">ĐĂNG NHẬP NHANH</button>
    </form>
  </div>

  <!-- MAIN APP -->
  <header class="driver-header">
    <div class="header-user">
      <div class="driver-avatar" id="avatarLetter">TX</div>
      <div>
        <div class="driver-name" id="displayDriverName">Tài xế</div>
        <div class="driver-plate" id="displayDriverPlate">--</div>
      </div>
    </div>
    <div style="display:flex;gap:6px;align-items:center;">
      <button onclick="openChangePassModal()" style="background:rgba(255,255,255,0.2);border:none;color:#fff;padding:6px 10px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;">🔑 Đổi MK</button>
      <button onclick="handleLogout()" style="background:rgba(255,255,255,0.15);border:none;color:#fff;padding:6px 10px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;">Thoát</button>
    </div>
  </header>

  <!-- BỘ LỌC NGÀY -->
  <div class="date-bar">
    <div class="date-chips">
      <button class="date-chip active" id="chipToday" onclick="setDateMode('TODAY')">📅 Hôm nay</button>
      <button class="date-chip" id="chipYesterday" onclick="setDateMode('YESTERDAY')">⏪ Hôm qua</button>
      <button class="date-chip" id="chipTomorrow" onclick="setDateMode('TOMORROW')">⏩ Ngày mai</button>
      <button class="date-chip" id="chipAll" onclick="setDateMode('ALL')">📋 Tất cả ngày</button>
    </div>
    <div class="date-picker-row">
      <span style="font-size:12px;font-weight:700;color:#475569;">Ngày chạy:</span>
      <input type="date" id="driverDateInput" class="date-input" onchange="onCustomDateChange(this.value)" />
      <button onclick="loadDriverData(true)" style="background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe;padding:6px 10px;border-radius:8px;font-weight:700;font-size:12px;cursor:pointer;">🔄 Tải lại</button>
    </div>
  </div>

  <main class="container" id="tripsContainer">
    <div style="text-align:center;padding:40px 0;color:var(--text-muted);">
      <div style="font-size:32px;margin-bottom:8px;">⏳</div>
      <div>Đang tải danh sách chuyến...</div>
    </div>
  </main>

  <!-- FLOATING 20' / 40' FILTER DOCK (GÓC PHẢI DƯỚI CHẠY THEO) -->
  <div class="floating-size-dock" id="floatingSizeDock">
    <button type="button" class="fab-size-btn" id="fabSize20" onclick="toggleContSize('20')">
      <span class="fab-size-lbl">20"</span>
      <span class="fab-size-cnt" id="fabCount20">0</span>
    </button>
    <button type="button" class="fab-size-btn" id="fabSize40" onclick="toggleContSize('40')">
      <span class="fab-size-lbl">40"</span>
      <span class="fab-size-cnt" id="fabCount40">0</span>
    </button>
  </div>

  <!-- BOTTOM NAVIGATION: ƯU TIÊN TAB NHẬP TRƯỚC, TAB XUẤT SAU -->
  <nav class="bottom-nav">
    <button class="nav-item active-nhap" id="tabN" onclick="switchTab('N')">
      <span class="nav-icon">📥</span>
      <span>Hàng Nhập (<span id="cntN">0</span>)</span>
    </button>
    <button class="nav-item" id="tabX" onclick="switchTab('X')">
      <span class="nav-icon">📤</span>
      <span>Hàng Xuất (<span id="cntX">0</span>)</span>
    </button>
    <button class="nav-item" id="tabAll" onclick="switchTab('ALL')">
      <span class="nav-icon">📋</span>
      <span>Tất cả (<span id="cntAll">0</span>)</span>
    </button>
  </nav>

  <!-- MODAL: CẬP NHẬT HÀNG XUẤT (CHỈ NHẬP SỐ CONT & SỐ SEAL) -->
  <div class="modal-overlay" id="updateTripModal">
    <div class="modal-sheet">
      <h3 style="margin:0 0 14px;font-size:17px;font-weight:800;color:#1e3a8a;">📝 Cập nhật Số Cont / Seal</h3>
      <input type="hidden" id="modalPoId" />
      <input type="hidden" id="modalCodePo" />
      <input type="hidden" id="modalCangDen" />
      <input type="hidden" id="modalPortTime" />
      <div class="form-group">
        <label>Số Container (4 chữ + 7 số)</label>
        <input type="text" id="modalSoCont" class="form-control" placeholder="VD: DRYU9969790" style="text-transform:uppercase;" />
      </div>
      <div class="form-group">
        <label>Số Seal</label>
        <input type="text" id="modalSoSeal" class="form-control" placeholder="VD: 678504" />
      </div>
      <div class="btn-row" style="margin-top:18px;">
        <button class="btn" style="background:#e2e8f0;color:#334155;" onclick="closeModal('updateTripModal')">Đóng</button>
        <button class="btn btn-update" onclick="saveTripUpdate()">⏳ LƯU CONT / SEAL</button>
      </div>
    </div>
  </div>

  <!-- MODAL: BÁO CHI PHÍ PHÁT SINH -->
  <div class="modal-overlay" id="expenseModal">
    <div class="modal-sheet">
      <h3 style="margin:0 0 14px;font-size:17px;font-weight:800;color:#b45309;">💰 Báo chi phí phát sinh</h3>
      <input type="hidden" id="expPoId" />
      <div class="form-group">
        <label>Loại chi phí phát sinh</label>
        <select id="expType" class="form-control">
          <option value="Chi hộ bốc xếp">📦 Chi hộ bốc xếp</option>
          <option value="Neo xe">⏳ Neo xe / Chờ đóng hàng</option>
          <option value="Nâng hạ rỗng">🏗️ Nâng hạ cont rỗng</option>
          <option value="Cân xe">⚖️ Cân xe</option>
          <option value="Lưu đêm">🌙 Lưu đêm</option>
          <option value="Khác">🏷️ Chi phí khác</option>
        </select>
      </div>
      <div class="form-group">
        <label>Số tiền phát sinh (VNĐ)</label>
        <input type="number" id="expAmount" class="form-control" placeholder="VD: 200000" step="10000" />
      </div>
      <div class="form-group">
        <label>Ghi chú lý do</label>
        <textarea id="expNote" class="form-control" rows="2" placeholder="VD: Kho đóng trễ 4 tiếng do thiếu hàng..."></textarea>
      </div>
      <div class="btn-row" style="margin-top:18px;">
        <button class="btn" style="background:#e2e8f0;color:#334155;" onclick="closeModal('expenseModal')">Hủy</button>
        <button class="btn btn-expense" onclick="saveExpense()">GỬI XÁC NHẬN CÔNG NỢ</button>
      </div>
    </div>
  </div>

  <!-- MODAL: ĐỔI MẬT KHẨU TÀI XẾ -->
  <div class="modal-overlay" id="changePassModal">
    <div class="modal-sheet">
      <h3 style="margin:0 0 14px;font-size:17px;font-weight:800;color:#1e3a8a;">🔑 Đổi mật khẩu xe</h3>
      <div class="form-group">
        <label>Mật khẩu hiện tại</label>
        <input type="password" id="oldDriverPass" class="form-control" placeholder="Nhập mật khẩu đang dùng" />
      </div>
      <div class="form-group">
        <label>Mật khẩu mới</label>
        <input type="password" id="newDriverPass" class="form-control" placeholder="Nhập mật khẩu mới (tối thiểu 4 ký tự)" />
      </div>
      <div class="btn-row" style="margin-top:18px;">
        <button class="btn" style="background:#e2e8f0;color:#334155;" onclick="closeModal('changePassModal')">Đóng</button>
        <button class="btn btn-update" onclick="submitChangeDriverPass()">LƯU MẬT KHẨU MỚI</button>
      </div>
    </div>
  </div>

  <div id="driverToast" style="display:none;position:fixed;bottom:85px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;font-weight:800;box-shadow:0 8px 25px rgba(0,0,0,0.3);z-index:9999;white-space:nowrap;">✅ Đã copy thông tin!</div>

  <script>
    let currentTrips = [];
    let currentDriverInfo = {};
    let currentFilter = 'N'; // Mặc định ưu tiên Tab Nhập
    let currentDateMode = 'TODAY';
    let selectedDateISO = getLocalTodayISO();
    let contSizeFilter = 'ALL'; // 'ALL' | '20' | '40'
    const API_BASE = '/api/index.php?route=';

    function showDriverToast(msg) {
      const el = document.getElementById('driverToast');
      if (!el) return;
      el.textContent = msg;
      el.style.display = 'block';
      clearTimeout(window._driverToastTimer);
      window._driverToastTimer = setTimeout(() => { el.style.display = 'none'; }, 2600);
    }

    function getLocalTodayISO(offsetDays = 0) {
      const d = new Date();
      d.setDate(d.getDate() + offsetDays);
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
    }

    function formatVNDate(isoStr) {
      if (!isoStr || isoStr === '2021-11-11' || isoStr === '1970-01-01') return 'Chưa gắn ngày';
      const p = isoStr.split('-');
      if (p.length === 3) return `${p[2]}/${p[1]}/${p[0]}`;
      return isoStr;
    }

    function getTripDateISO(t) {
      const n = (t.ngayTraHang || '').trim();
      if (n && n !== '2021-11-11' && n !== '1970-01-01') return n;
      const th = (t.timeThucHien || '').trim();
      if (th && th !== '2021-11-11' && th !== '1970-01-01') return th;
      return '';
    }

    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('driverDateInput').value = selectedDateISO;
      const token = localStorage.getItem('vs_driver_token');
      if (token) {
        document.getElementById('driverLoginView').style.display = 'none';
        const savedInfo = JSON.parse(localStorage.getItem('vs_driver_info') || 'null');
        if (savedInfo) renderDriverHeader(savedInfo);
        loadDriverData();
      }
    });

    function toggleContSize(size) {
      contSizeFilter = (contSizeFilter === size) ? 'ALL' : size;
      document.getElementById('fabSize20').classList.toggle('active-20', contSizeFilter === '20');
      document.getElementById('fabSize40').classList.toggle('active-40', contSizeFilter === '40');
      renderTrips();
    }

    function setDateMode(mode) {
      currentDateMode = mode;
      document.getElementById('chipToday').classList.toggle('active', mode === 'TODAY');
      document.getElementById('chipYesterday').classList.toggle('active', mode === 'YESTERDAY');
      document.getElementById('chipTomorrow').classList.toggle('active', mode === 'TOMORROW');
      document.getElementById('chipAll').classList.toggle('active', mode === 'ALL');

      if (mode === 'TODAY') {
        selectedDateISO = getLocalTodayISO(0);
        document.getElementById('driverDateInput').value = selectedDateISO;
      } else if (mode === 'YESTERDAY') {
        selectedDateISO = getLocalTodayISO(-1);
        document.getElementById('driverDateInput').value = selectedDateISO;
      } else if (mode === 'TOMORROW') {
        selectedDateISO = getLocalTodayISO(1);
        document.getElementById('driverDateInput').value = selectedDateISO;
      }
      renderTrips();
    }

    function onCustomDateChange(val) {
      if (!val) return;
      selectedDateISO = val;
      currentDateMode = 'CUSTOM';
      document.querySelectorAll('.date-chip').forEach(c => c.classList.remove('active'));
      loadDriverData(false);
    }

    async function handleDriverLogin(e) {
      e.preventDefault();
      const plate = document.getElementById('loginPlate').value.trim().toUpperCase();
      const pin = document.getElementById('loginPin').value.trim();
      const errBox = document.getElementById('loginError');

      try {
        const res = await fetch(`${API_BASE}/auth/driver-login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ plate, username: plate, phone: plate, password: pin, pin })
        });
        const data = await res.json();
        if (!res.ok || !data.ok) {
          errBox.textContent = data.error || 'Đăng nhập thất bại!';
          errBox.style.display = 'block';
          return;
        }

        localStorage.setItem('vs_driver_token', data.token);
        localStorage.setItem('vs_driver_info', JSON.stringify(data.driver));
        document.getElementById('driverLoginView').style.display = 'none';
        renderDriverHeader(data.driver);
        loadDriverData();
      } catch (err) {
        errBox.textContent = 'Lỗi kết nối máy chủ!';
        errBox.style.display = 'block';
      }
    }

    function openChangePassModal() {
      document.getElementById('oldDriverPass').value = '';
      document.getElementById('newDriverPass').value = '';
      document.getElementById('changePassModal').classList.add('open');
    }

    async function submitChangeDriverPass() {
      const token = localStorage.getItem('vs_driver_token');
      const oldPassword = document.getElementById('oldDriverPass').value.trim();
      const newPassword = document.getElementById('newDriverPass').value.trim();
      if (!newPassword || newPassword.length < 4) {
        alert('Vui lòng nhập mật khẩu mới tối thiểu 4 ký tự!');
        return;
      }
      try {
        const res = await fetch(`${API_BASE}/driver/change-password`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
          body: JSON.stringify({ oldPassword, newPassword })
        });
        const data = await res.json();
        if (data.ok) {
          alert('✅ Đã đổi mật khẩu thành công!');
          closeModal('changePassModal');
        } else {
          alert('Lỗi: ' + (data.error || 'Không thể đổi mật khẩu'));
        }
      } catch (err) {
        alert('Lỗi kết nối máy chủ!');
      }
    }

    function handleLogout() {
      if (confirm('Bạn có muốn đăng xuất tài khoản?')) {
        localStorage.removeItem('vs_driver_token');
        localStorage.removeItem('vs_driver_info');
        location.reload();
      }
    }

    async function loadDriverData(forceRefresh = false) {
      const token = localStorage.getItem('vs_driver_token');
      try {
        const url = `${API_BASE}/driver/my-trips&date=${encodeURIComponent(selectedDateISO)}${forceRefresh ? '&refresh=1' : ''}`;
        const res = await fetch(url, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (res.status === 401 || res.status === 403) {
          localStorage.removeItem('vs_driver_token');
          location.reload();
          return;
        }
        const data = await res.json();
        if (data.ok) {
          currentTrips = data.trips || [];
          renderDriverHeader(data.driverInfo);
          renderTrips();
        }
      } catch (err) {
        console.error('Fetch error:', err);
      }
    }

    function renderDriverHeader(info) {
      if (!info) return;
      currentDriverInfo = { ...currentDriverInfo, ...info };
      localStorage.setItem('vs_driver_info', JSON.stringify(currentDriverInfo));
      document.getElementById('displayDriverName').textContent = info.name || 'Tài xế';
      document.getElementById('displayDriverPlate').textContent = `${info.plate || '--'} • ${info.vendor || ''}`;
      document.getElementById('avatarLetter').textContent = (info.name || 'TX').slice(0, 2).toUpperCase();
    }

    function buildDriverZaloText(t) {
      if (!t) return '';
      const isXuat = t.xuatNhapPo === 'X';
      const ngayGiao = formatVNDate(getTripDateISO(t));
      const plate = (t.soXePo || currentDriverInfo.plate || '').trim();
      const tenLaiXe = (currentDriverInfo.name || '').trim();
      const sdtLaiXe = (currentDriverInfo.phone || '').trim();
      const cccd = (currentDriverInfo.cccd || '').trim();
      const gplx = (currentDriverInfo.gplx || '').trim();

      if (isXuat) {
        return [
          `THÔNG TIN ĐÓNG HÀNG:`,
          `- Khách hàng: ${t.tenKhachPo || ''}`,
          `- Kho ĐÓNG: ${t.khoNhanHangPo || ''}`,
          `- Địa chỉ: ${t.diaChiNhanPo || ''}\t- Tỉnh: ${t.tinhNhanPo || ''}`,
          `- Số cont: ${t.soContPo || ''}\t\t- Số seal: ${t.soSealPo || ''}`,
          `- Ngày ĐÓNG: ${ngayGiao}`,
          `- Nơi cấp rỗng: ${t.noiLayContPo || ''}`,
          `- Thời gian dự kiến tới kho: `,
          `- Liên hệ: ${t.lienHeNhanPo || ''}`,
          `- Số xe: ${plate}`,
          `- Tên Lái Xe: ${tenLaiXe}`,
          `- Số CMND: ${cccd}     Nơi cấp: Cục QLHC & TTXH`,
          `- Số GPLX: ${gplx}           Nơi cấp:SỞ GTVT`,
          `- SĐT: ${sdtLaiXe}`
        ].join('\n');
      } else {
        return [
          `THÔNG TIN GIAO HÀNG:`,
          `- Kho GIAO: ${t.khoNhanHangPo || ''}`,
          `- Địa chỉ: ${t.diaChiNhanPo || ''}\t- Tỉnh: ${t.tinhNhanPo || ''}`,
          `- Liên hệ: ${t.lienHeNhanPo || ''}`,
          `- Số cont: ${t.soContPo || ''}\t\t- Số seal: ${t.soSealPo || ''}`,
          `- Ngày GIAO: ${ngayGiao}`,
          `- Số xe: ${plate}`,
          `- Tên Lái Xe: ${tenLaiXe}`,
          `- SĐT: ${sdtLaiXe}`,
          `- Thời gian tới kho: `
        ].join('\n');
      }
    }

    async function copyTextToClipboard(text) {
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(text);
          return true;
        }
      } catch (e) {}
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta);
      return true;
    }

    async function copyDriverTripText(idPo) {
      const t = currentTrips.find(x => String(x.idPo) === String(idPo));
      if (!t) return;
      const text = buildDriverZaloText(t);
      await copyTextToClipboard(text);
      showDriverToast('📋 Đã copy đầy đủ thông tin chuyến!');
    }

    async function shareDriverTripZalo(idPo) {
      const t = currentTrips.find(x => String(x.idPo) === String(idPo));
      if (!t) return;
      const text = buildDriverZaloText(t);
      await copyTextToClipboard(text);
      showDriverToast('💬 Đã copy thông tin! Chọn Zalo để dán / chia sẻ');
      if (navigator.share) {
        try {
          await navigator.share({ text });
        } catch (err) {
          // User cancelled share sheet; text is already in clipboard
        }
      }
    }

    function switchTab(type) {
      currentFilter = type;
      document.getElementById('tabN').className = 'nav-item' + (type === 'N' ? ' active-nhap' : '');
      document.getElementById('tabX').className = 'nav-item' + (type === 'X' ? ' active-xuat' : '');
      document.getElementById('tabAll').className = 'nav-item' + (type === 'ALL' ? ' active-all' : '');
      renderTrips();
    }

    function renderTrips() {
      const dateFiltered = currentTrips.filter(t => {
        if (currentDateMode === 'ALL') return true;
        const d = getTripDateISO(t);
        return d === selectedDateISO;
      });

      const cntAll = dateFiltered.length;
      const cntN = dateFiltered.filter(t => t.xuatNhapPo === 'N').length;
      const cntX = dateFiltered.filter(t => t.xuatNhapPo === 'X').length;

      document.getElementById('cntN').textContent = cntN;
      document.getElementById('cntX').textContent = cntX;
      document.getElementById('cntAll').textContent = cntAll;

      const tabFiltered = dateFiltered.filter(t => {
        if (currentFilter === 'ALL') return true;
        return t.xuatNhapPo === currentFilter;
      });

      const c20 = tabFiltered.filter(t => Number(t.cont40Po) === 0).length;
      const c40 = tabFiltered.filter(t => Number(t.cont40Po) > 0).length;
      document.getElementById('fabCount20').textContent = c20;
      document.getElementById('fabCount40').textContent = c40;

      const filtered = tabFiltered.filter(t => {
        if (contSizeFilter === '20') return Number(t.cont40Po) === 0;
        if (contSizeFilter === '40') return Number(t.cont40Po) > 0;
        return true;
      });

      const container = document.getElementById('tripsContainer');
      if (filtered.length === 0) {
        const tabName = currentFilter === 'N' ? 'Hàng Nhập' : (currentFilter === 'X' ? 'Hàng Xuất' : 'chuyến nào');
        const dateLabel = currentDateMode === 'ALL' ? 'tất cả các ngày' : `ngày ${formatVNDate(selectedDateISO)}`;
        const otherTypeCount = currentFilter === 'N' ? cntX : (currentFilter === 'X' ? cntN : 0);
        const totalAnyDate = currentTrips.length;

        container.innerHTML = `
          <div style="text-align:center;padding:42px 16px;color:var(--text-muted);background:#fff;border-radius:14px;border:1px dashed var(--border);">
            <div style="font-size:40px;margin-bottom:8px;">📭</div>
            <div style="font-weight:800;font-size:15.5px;color:#334155;">Chưa có ${tabName} trong ${dateLabel}</div>
            ${otherTypeCount > 0 ? `<div style="margin-top:8px;"><button onclick="switchTab('${currentFilter === 'N' ? 'X' : 'N'}')" class="btn btn-update" style="padding:8px 14px;font-size:13px;">👉 Xem ${otherTypeCount} chuyến ${currentFilter === 'N' ? 'Hàng Xuất' : 'Hàng Nhập'} hôm nay</button></div>` : ''}
            ${totalAnyDate > 0 && currentDateMode !== 'ALL' ? `<div style="margin-top:10px;"><button onclick="setDateMode('ALL');switchTab('ALL');" style="background:#f1f5f9;color:#1e40af;border:1px solid #cbd5e1;padding:7px 14px;border-radius:8px;font-weight:700;font-size:12.5px;cursor:pointer;">📋 Xem toàn bộ ${totalAnyDate} chuyến các ngày khác</button></div>` : ''}
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(t => {
        const isXuat = t.xuatNhapPo === 'X';
        const is40 = Number(t.cont40Po) > 0;
        const typeClass = isXuat ? 'xuat-card' : 'nhap-card';
        const typeBadge = isXuat ? '<span class="badge badge-xuat">📤 XUẤT</span>' : '<span class="badge badge-nhap">📥 NHẬP</span>';
        const sizeBadge = is40 ? '<span class="badge badge-40">40"</span>' : '<span class="badge badge-20">20"</span>';
        const phoneClean = (t.lienHeNhanPo || '').replace(/[^0-9]/g, '');
        const tripDateIso = getTripDateISO(t);
        const tripDate = formatVNDate(tripDateIso);
        const isLocked = Boolean(t._isLocked) || (tripDateIso && tripDateIso < getLocalTodayISO(0));
        const isPending = Boolean(t._pendingApproval);
        const statusBadge = isLocked
          ? '<span class="badge" style="background:#fee2e2;color:#b91c1c;">🔒 Đã khóa sổ</span>'
          : (isPending ? '<span class="badge" style="background:#fef3c7;color:#b45309;">⏳ Chờ duyệt TMS</span>' : '');
        const warehouseTitle = (t.khoNhanHangPo || t.tenKhachPo || 'Chưa rõ tên kho').trim();
        const addrText = [t.diaChiNhanPo, t.tinhNhanPo ? `(${t.tinhNhanPo})` : ''].filter(Boolean).join(' ');

        return `
          <div class="trip-card ${typeClass}">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
              <div style="display:flex;gap:5px;align-items:center;flex-wrap:wrap;">
                ${typeBadge} ${sizeBadge} <b style="font-size:12.5px;color:#64748b;">#${t.idPo}</b> ${statusBadge}
              </div>
              <span class="badge" style="background:#f1f5f9;color:#0f172a;">📅 ${tripDate}</span>
            </div>

            ${isXuat ? `
            <div style="background:#ffedd5;border:1.5px solid #fdba74;border-radius:10px;padding:9px 11px;margin:6px 0;">
              <div style="font-size:10.5px;font-weight:800;color:#9a3412;text-transform:uppercase;letter-spacing:0.3px;">🏭 KHO ĐÓNG HÀNG</div>
              <div style="font-size:15.5px;font-weight:900;color:#c2410c;margin-top:2px;line-height:1.25;">📍 ${warehouseTitle}</div>
              ${addrText ? `<div style="font-size:12.5px;color:#7c2d12;font-weight:600;margin-top:3px;">${addrText}</div>` : ''}
              ${t.tenKhachPo && t.tenKhachPo !== warehouseTitle ? `<div style="font-size:11.5px;color:#9a3412;margin-top:2px;">👤 KH: ${t.tenKhachPo}</div>` : ''}
            </div>
            ` : `
            <div style="background:#eff6ff;border:1.5px solid #93c5fd;border-radius:10px;padding:9px 11px;margin:6px 0;">
              <div style="font-size:10.5px;font-weight:800;color:#1e40af;text-transform:uppercase;letter-spacing:0.3px;">🏭 KHO GIAO / TRẢ HÀNG</div>
              <div style="font-size:15.5px;font-weight:900;color:#1d4ed8;margin-top:2px;line-height:1.25;">📍 ${warehouseTitle}</div>
              ${addrText ? `<div style="font-size:12.5px;color:#1e3a8a;font-weight:600;margin-top:3px;">${addrText}</div>` : ''}
            </div>
            `}

            <div style="margin-top:8px;padding:8px 10px;background:rgba(241,245,249,0.7);border-radius:9px;display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:12.5px;">
              <div><b>Số Cont:</b> <span style="color:#1e40af;font-weight:800;">${t.soContPo || '(Chưa có)'}</span></div>
              <div><b>Số Seal:</b> <span style="color:#0f172a;font-weight:700;">${t.soSealPo || '(Chưa có)'}</span></div>
              ${isXuat ? `
                <div><b>Lấy rỗng:</b> ${t.noiLayContPo || '--'}</div>
                <div><b>Cảng đến:</b> <span style="color:#c2410c;font-weight:700;">${t.tinhXuatHangPo || t.cangDenPo || '--'}</span></div>
              ` : ''}
            </div>

            ${t.lienHeNhanPo ? `
            <div class="info-row" style="margin-top:8px;">
              <span class="info-icon">📞</span>
              <div><b>Liên hệ kho:</b> ${t.lienHeNhanPo}</div>
            </div>` : ''}

            <div class="btn-row" style="flex-wrap:wrap;">
              ${phoneClean ? `<a href="tel:${phoneClean}" class="btn btn-call" style="flex:1 1 auto;">📞 Gọi kho</a>` : ''}
              <button class="btn" style="background:#0068ff;color:#fff;flex:1 1 auto;" onclick="shareDriverTripZalo('${t.idPo}')">💬 Share Zalo</button>
              <button class="btn" style="background:#e0f2fe;color:#0369a1;border:1px solid #bae6fd;flex:1 1 auto;" onclick="copyDriverTripText('${t.idPo}')">📋 Copy TT</button>
            </div>
            <div class="btn-row" style="margin-top:6px;">
              ${isLocked ? `
                <div style="flex:1;background:#f1f5f9;color:#94a3b8;border:1px solid #cbd5e1;padding:9px;border-radius:10px;text-align:center;font-weight:700;font-size:12px;">
                  🔒 Đã kết thúc ngày - Khóa chỉnh sửa
                </div>
              ` : `
                ${isXuat ? `<button class="btn btn-update" onclick="openUpdateModal('${t.idPo}', '${t.codePo || ''}', '${t.soContPo || ''}', '${t.soSealPo || ''}', '${t.tinhXuatHangPo || t.cangDenPo || ''}')">✏️ Nhập Cont/Seal</button>` : ''}
                <button class="btn btn-expense" onclick="openExpenseModal('${t.idPo}')">💰 Báo chi phí</button>
              `}
            </div>
          </div>
        `;
      }).join('');
    }

    function openUpdateModal(idPo, codePo, soCont, soSeal, cangDen) {
      document.getElementById('modalPoId').value = idPo;
      document.getElementById('modalCodePo').value = codePo;
      document.getElementById('modalSoCont').value = soCont;
      document.getElementById('modalSoSeal').value = soSeal;
      document.getElementById('modalCangDen').value = cangDen;
      document.getElementById('modalPortTime').value = '';
      document.getElementById('updateTripModal').classList.add('open');
    }

    function openExpenseModal(idPo) {
      document.getElementById('expPoId').value = idPo;
      document.getElementById('expAmount').value = '';
      document.getElementById('expNote').value = '';
      document.getElementById('expenseModal').classList.add('open');
    }

    function closeModal(modalId) {
      document.getElementById(modalId).classList.remove('open');
    }

    async function saveTripUpdate() {
      const token = localStorage.getItem('vs_driver_token');
      const idPo = document.getElementById('modalPoId').value;
      const codePo = document.getElementById('modalCodePo').value;
      const soCont = document.getElementById('modalSoCont').value.trim();
      const soSeal = document.getElementById('modalSoSeal').value.trim();
      const cangDen = document.getElementById('modalCangDen').value.trim();
      const portTime = document.getElementById('modalPortTime').value.trim();

      try {
        const res = await fetch(`${API_BASE}/driver/update-trip`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ idPo, codePo, soCont, soSeal, cangDen, portTime })
        });
        const data = await res.json();
        if (data.ok) {
          alert('⏳ Đã gửi thông tin Cont/Seal chờ Điều vận kiểm duyệt trước khi đẩy lên TMS!');
          closeModal('updateTripModal');
          loadDriverData(true);
        } else {
          alert('Lỗi: ' + (data.error || 'Không thể lưu!'));
        }
      } catch (err) {
        alert('Lỗi kết nối máy chủ!');
      }
    }

    async function saveExpense() {
      const token = localStorage.getItem('vs_driver_token');
      const idPo = document.getElementById('expPoId').value;
      const expenseType = document.getElementById('expType').value;
      const amount = document.getElementById('expAmount').value;
      const note = document.getElementById('expNote').value.trim();

      if (!amount || amount <= 0) {
        alert('Vui lòng nhập số tiền phát sinh hợp lệ!');
        return;
      }

      try {
        const res = await fetch(`${API_BASE}/driver/add-expense`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ idPo, expenseType, amount, note })
        });
        const data = await res.json();
        if (data.ok) {
          alert('✅ Đã gửi chi phí phát sinh vào hệ thống đối soát!');
          closeModal('expenseModal');
        } else {
          alert('Lỗi: ' + (data.error || 'Không thể lưu!'));
        }
      } catch (err) {
        alert('Lỗi kết nối máy chủ!');
      }
    }
  </script>
</body>
